aid: cellink
name: CelLink
description: 'CelLink (CelLink Technologies / CelLink Corporation) manufactures large-format,
  high-conductance flexible circuits that consolidate power, data, and sensing into thin,
  lightweight layers, replacing traditional wire harnesses and busbars. Its product lines are
  Battery Pack Interconnect, Flex Harness, and Data Center power delivery, serving automotive,
  aerospace, industrial, data center, and grid-storage electrification markets. Founded by CEO
  Kevin Coakley and VP Engineering Malcolm Brown, the company is headquartered in San Carlos,
  California, with sites in Georgetown, Texas; Wixom, Michigan; Hamburg, Germany; and Shanghai,
  China. CelLink circuits have been in electric-vehicle production since 2020. CelLink is a
  hardware manufacturer and publishes no public developer portal, API, or SDK surface.'
